<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    form input[type=text],
    form input[type=password] {
        display: block;
        width: 100%;
        padding: 8px 12px;
        margin-top: 4px;
        border: 1px solid #ced4da;
        border-radius: 6px;
    }
    .helptext, form ul {
    font-size: 13px;
    color: gray;
}
</style>


</head>
<body class="bg-light">

    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
            <div class="card shadow">    
            <div class="card body p-4"> 

    <h1 class="text-center mb-4">Signup</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Account banayein</button>
    </form>
    <p class="text-center mt-3 mb-0">Pehle se account hai? <a href="{% url 'login' %}">Login</a></p>
            </div>
            </div>
            </div>
            </div>
            </div>




        </body>
</html>
