<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type=text] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-btn {
            padding: 10px 18px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            background: #f9fafb;
            border-radius: 8px;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .actions a {
            text-decoration: none;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 6px;
            color: white;
            margin-left: 5px;
        }

        .btn-done {
            background: #16a34a;
        }

        .btn-delete {
            background: #dc2626;
        }

        .empty {
            text-align: center;
            color: gray;
        }
    .user-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}
.user-bar form {
    margin-bottom: 0;
}

.logout-btn {
    padding: 6px 12px;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
    
    </style>
</head>
<body>
    <div class="container">
        <h1>Todo List</h1>
    <div class="user-bar">
    <span>Salam, {{ request.user.username }}</span>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Kaam likhein" required>
            <button type="submit" class="add-btn">Add</button>
        </form>

        <ul>
            {% for todo in todos %}
                <li>
                    <span class="{% if todo.completed %}done{% endif %}">
                        {{ todo.title }}
                    </span>
                    <span class="actions">
                        <a href="{% url 'toggle' todo.pk %}" class="btn-done">Done</a>
                        <a href="{% url 'delete' todo.pk %}" class="btn-delete">Delete</a>
                    </span>
                </li>
            {% empty %}
                <li class="empty">Abhi koi kaam nahi hai!</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
